openapi: 3.1.0
info:
  title: HealthTrack Phase 3 API
  description: Educational hypertension monitoring prototype. Not for real patient
    data or clinical decision-making.
  version: 0.3.0
paths:
  /health:
    get:
      tags:
      - System
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/token:
    post:
      tags:
      - Authentication
      summary: Login
      operationId: login_auth_token_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_auth_token_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /patients:
    post:
      tags:
      - Patients
      summary: Create Patient
      operationId: create_patient_patients_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Patients
      summary: List Patients
      operationId: list_patients_patients_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientOut'
                title: Response List Patients Patients Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /patients/{patient_id}:
    get:
      tags:
      - Patients
      summary: Get Patient
      operationId: get_patient_patients__patient_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Patients
      summary: Update Patient
      operationId: update_patient_patients__patient_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Patients
      summary: Delete Patient
      operationId: delete_patient_patients__patient_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assignments:
    post:
      tags:
      - Administration
      summary: Assign Staff
      operationId: assign_staff_assignments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /assignments/{assignment_id}:
    delete:
      tags:
      - Administration
      summary: Unassign Staff
      operationId: unassign_staff_assignments__assignment_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: assignment_id
        in: path
        required: true
        schema:
          type: integer
          title: Assignment Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /patients/{patient_id}/vitals:
    post:
      tags:
      - Vital signs
      summary: Create Vital
      operationId: create_vital_patients__patient_id__vitals_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Vital signs
      summary: List Vitals
      operationId: list_vitals_patients__patient_id__vitals_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VitalOut'
                title: Response List Vitals Patients  Patient Id  Vitals Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vitals/{vital_id}:
    get:
      tags:
      - Vital signs
      summary: Get Vital
      operationId: get_vital_vitals__vital_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: vital_id
        in: path
        required: true
        schema:
          type: integer
          title: Vital Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Vital signs
      summary: Update Vital
      operationId: update_vital_vitals__vital_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: vital_id
        in: path
        required: true
        schema:
          type: integer
          title: Vital Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Vital signs
      summary: Delete Vital
      operationId: delete_vital_vitals__vital_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: vital_id
        in: path
        required: true
        schema:
          type: integer
          title: Vital Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /patients/{patient_id}/activities:
    post:
      tags:
      - Activities
      summary: Create Activity
      operationId: create_activity_patients__patient_id__activities_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Activities
      summary: List Activities
      operationId: list_activities_patients__patient_id__activities_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
          title: Patient Id
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Start
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityOut'
                title: Response List Activities Patients  Patient Id  Activities Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /activities/{activity_id}:
    get:
      tags:
      - Activities
      summary: Get Activity
      operationId: get_activity_activities__activity_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: integer
          title: Activity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Activities
      summary: Update Activity
      operationId: update_activity_activities__activity_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: integer
          title: Activity Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Activities
      summary: Delete Activity
      operationId: delete_activity_activities__activity_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: integer
          title: Activity Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActivityCreate:
      properties:
        steps:
          type: integer
          maximum: 100000.0
          minimum: 0.0
          title: Steps
          examples:
          - 6000
        active_minutes:
          type: integer
          maximum: 1440.0
          minimum: 0.0
          title: Active Minutes
          examples:
          - 45
        activity_date:
          type: string
          format: date
          title: Activity Date
          examples:
          - '2026-11-07'
      type: object
      required:
      - steps
      - active_minutes
      - activity_date
      title: ActivityCreate
    ActivityOut:
      properties:
        id:
          type: integer
          title: Id
        patient_id:
          type: integer
          title: Patient Id
        steps:
          type: integer
          title: Steps
        active_minutes:
          type: integer
          title: Active Minutes
        activity_date:
          type: string
          format: date
          title: Activity Date
      type: object
      required:
      - id
      - patient_id
      - steps
      - active_minutes
      - activity_date
      title: ActivityOut
    ActivityUpdate:
      properties:
        steps:
          type: integer
          maximum: 100000.0
          minimum: 0.0
          title: Steps
          examples:
          - 6000
        active_minutes:
          type: integer
          maximum: 1440.0
          minimum: 0.0
          title: Active Minutes
          examples:
          - 45
        activity_date:
          type: string
          format: date
          title: Activity Date
          examples:
          - '2026-11-07'
      type: object
      required:
      - steps
      - active_minutes
      - activity_date
      title: ActivityUpdate
    AssignmentCreate:
      properties:
        staff_user_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Staff User Id
        patient_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Patient Id
      type: object
      required:
      - staff_user_id
      - patient_id
      title: AssignmentCreate
    Body_login_auth_token_post:
      properties:
        grant_type:
          anyOf:
          - type: string
            pattern: ^password$
          - type: 'null'
          title: Grant Type
        username:
          type: string
          title: Username
        password:
          type: string
          format: password
          title: Password
        scope:
          type: string
          title: Scope
          default: ''
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          format: password
          title: Client Secret
      type: object
      required:
      - username
      - password
      title: Body_login_auth_token_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PatientCreate:
      properties:
        full_name:
          type: string
          maxLength: 150
          minLength: 2
          title: Full Name
          examples:
          - Sample Patient
        date_of_birth:
          type: string
          format: date
          title: Date Of Birth
          examples:
          - '1980-04-15'
        monitoring_consent:
          type: boolean
          title: Monitoring Consent
          default: false
        user_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: User Id
      type: object
      required:
      - full_name
      - date_of_birth
      title: PatientCreate
    PatientOut:
      properties:
        id:
          type: integer
          title: Id
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
        full_name:
          type: string
          title: Full Name
        date_of_birth:
          type: string
          format: date
          title: Date Of Birth
        enrolled:
          type: boolean
          title: Enrolled
        monitoring_consent:
          type: boolean
          title: Monitoring Consent
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - user_id
      - full_name
      - date_of_birth
      - enrolled
      - monitoring_consent
      - created_at
      title: PatientOut
    PatientUpdate:
      properties:
        full_name:
          anyOf:
          - type: string
            maxLength: 150
            minLength: 2
          - type: 'null'
          title: Full Name
        enrolled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enrolled
        monitoring_consent:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Monitoring Consent
      type: object
      title: PatientUpdate
    TokenOut:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - access_token
      title: TokenOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VitalCreate:
      properties:
        systolic:
          type: integer
          maximum: 300.0
          minimum: 50.0
          title: Systolic
          examples:
          - 122
        diastolic:
          type: integer
          maximum: 200.0
          minimum: 30.0
          title: Diastolic
          examples:
          - 79
        pulse:
          type: integer
          maximum: 250.0
          minimum: 30.0
          title: Pulse
          examples:
          - 68
        measured_at:
          type: string
          format: date-time
          title: Measured At
          examples:
          - '2026-11-08T09:00:00Z'
        source:
          type: string
          enum:
          - manual
          - device
          title: Source
          default: manual
      type: object
      required:
      - systolic
      - diastolic
      - pulse
      - measured_at
      title: VitalCreate
    VitalOut:
      properties:
        id:
          type: integer
          title: Id
        patient_id:
          type: integer
          title: Patient Id
        systolic:
          type: integer
          title: Systolic
        diastolic:
          type: integer
          title: Diastolic
        pulse:
          type: integer
          title: Pulse
        measured_at:
          type: string
          format: date-time
          title: Measured At
        received_at:
          type: string
          format: date-time
          title: Received At
        source:
          type: string
          title: Source
      type: object
      required:
      - id
      - patient_id
      - systolic
      - diastolic
      - pulse
      - measured_at
      - received_at
      - source
      title: VitalOut
    VitalUpdate:
      properties:
        systolic:
          type: integer
          maximum: 300.0
          minimum: 50.0
          title: Systolic
          examples:
          - 122
        diastolic:
          type: integer
          maximum: 200.0
          minimum: 30.0
          title: Diastolic
          examples:
          - 79
        pulse:
          type: integer
          maximum: 250.0
          minimum: 30.0
          title: Pulse
          examples:
          - 68
        measured_at:
          type: string
          format: date-time
          title: Measured At
          examples:
          - '2026-11-08T09:00:00Z'
        source:
          type: string
          enum:
          - manual
          - device
          title: Source
          default: manual
      type: object
      required:
      - systolic
      - diastolic
      - pulse
      - measured_at
      title: VitalUpdate
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
